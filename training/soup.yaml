# Cyber CIV fine-tune — Soup config
# Run from this directory:  soup train --config soup.yaml
# Dataset: training/data/train.jsonl (Alpaca format), produced by
# convert_to_soup.py from the sim's civ_memory decision records.
# Converted 2026-10-14 02:21 EDT: 2,987 LLM-only examples kept
# (108 scripted + 0 corrupt discarded). Both harvests at target.
# Ready to train.
# Training itself wants a GPU; this VM has none.
base: meta-llama/Llama-3.1-8B-Instruct
task: sft
data:
  train: ./data/train.jsonl
  format: alpaca
  val_split: 0.1
training:
  epochs: 3
  lr: 2.0e-5
  batch_size: auto
  lora:
    r: 64
    alpha: 16
  quantization: 4bit
output: ./output
